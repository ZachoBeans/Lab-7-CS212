[project]
name = "the-living-sunstone"
version = "1.0.0"
description = "Dimensional Rift: The Living Sunstone - an AI-assisted choose-your-own-adventure text game."
readme = "readme.md"
authors = [{ name = "Zach Snyder" }]
requires-python = ">=3.10"
dependencies = [
    "openai>=3.59.0",
    "python-dotenv>=1.2.4",
]

[tool.uv]
# This is a script-style project (run directly with Python), not an installable package.
package = false
